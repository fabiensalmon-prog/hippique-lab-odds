name: Capture des cotes avant départ

on:
  workflow_dispatch:
  schedule:
    - cron: "7 7-19 * * *"     # filet de sécurité : relance chaque heure si la chaîne s'est arrêtée (GitHub peut retarder)

permissions:
  contents: write
  actions: write

concurrency:
  group: capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Capturer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "hippique-lab-bot"
          git config user.email "actions@users.noreply.github.com"
          python3 collect/capture.py 345
